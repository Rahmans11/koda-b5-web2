<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="build calendar by css" />
    <title>Minitask2</title>
    <style>
        .satu{
            text-align: justify;
        }
        .Calendar {
        border: 2 solid black;
        display: table;
        width: 100%;
        border-collapse: collapse;
        align-items: center;
        color: blue;
      }
      .dua,
      .tiga,
      .empat,
      .lima,
      .enam,
      .tujuh,
      .delapan {
        display: inline-block;
        display: table-cell;
        width: "100px";
        box-sizing: border-box;
        padding: 8px;
        background-color: cyan;
        border-style: ridge;
        text-align: center;
        font-size: x-large;
      }
      .border{
        display: table-row;
      }
      body {
        font-family: "Arial", sans-serif;
        background-color: aquamarine;
        color: gray;
      }
      main{
        padding: 10px;
        margin: 5px;
        width: 800px;
        height: 600px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1 class="satu">Calendar of November 2025</h1>
      </div>
    </header>
    <main>

          <div class="empat">5</div>
          <div class="empat">6</div>
          <div class="empat">7</div>
          <div class="empat">8</div>
        </div>
        <div class="border">
          <div class="lima">9</div>
          <div class="lima">10</div>
          <div class="lima">11</div>
          <div class="lima">12</div>
          <div class="lima">13</div>

          <div class="lima">15</div>

        <div class="border">

            <div class="delapan"></div>

    </main>
    <footer>
        <div>
            <a href="minitask3.html">minitask3</a>
